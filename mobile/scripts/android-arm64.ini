[binaries]
c = '@TOOLCHAIN@/aarch64-linux-android29-clang'
cpp = '@TOOLCHAIN@/aarch64-linux-android29-clang++'
ar = '@TOOLCHAIN@/llvm-ar'
strip = '@TOOLCHAIN@/llvm-strip'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[built-in options]
c_args = ['-fPIC']
cpp_args = ['-fPIC']
