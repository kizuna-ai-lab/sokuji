plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.kizunaai.sokuji.audiocapture'
version = '0.1.0'

android {
  namespace "ai.kizunaai.sokuji.audiocapture"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    ndk {
      abiFilters "arm64-v8a", "x86_64"
    }
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  lintOptions {
    abortOnError false
  }
}
