# The Python binding to libsokuji_native (sokuji_native/): a test harness only. The app loads the
# library through the Node addon (native/node); until native-v1.4.0 this directory also built a wheel
# for the Python sidecar, which is gone. Tests point it at a built stage with SOKUJI_NATIVE_DIR.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from this source tree, not from a sokuji_native wheel that happens
# to be installed in the interpreter (which is what a bare `pytest native/python/tests`
# from the repo root would otherwise test).
pythonpath = ["."]
