name: Build and Release

on:
  push:
    # `mobile` is the long-lived integration branch of the mobile app: it is
    # built and tested like main so it never drifts unverified. Releases are
    # tag-gated below, so a push to it never publishes anything.
    branches: [main, master, mobile]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master, mobile]

permissions:
  contents: write
  packages: write
  issues: write
  # The build job's SignPath step reads the helper artifact it uploads, as
  # sign-windows does for the installer; unlisted permissions are `none`.
  actions: read

jobs:
  # No workflow ran vitest before this one, so `npm run build` (plain
  # `vite build`, no tsc) was the only gate and a consistency test could not
  # fail CI. That is what let the LogsPanel copy-export defect and the
  # console/logStore drift in #441 survive.
  #
  # Deliberately scoped rather than the whole suite: the full run has
  # pre-existing failures unrelated to these files, and a job that is red on
  # arrival gets ignored. Widen it as suites are cleaned up — the value is in
  # the diagnostics guards running on every PR, starting now.
  #
  # src/lib/local-inference joined on 2026-09-06 (after #497): its 51 files were
  # green but had never run in CI, so the source guards for the ASR workers
  # (harness-consolidation.test.ts) could not fail a PR — #497's first version
  # of the #470 decode-handoff guard was vacuous for two workers and nothing
  # noticed until a maintainer ran it locally.
  test:
    name: test (diagnostics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `npm ci` runs lifecycle scripts from this checkout, and this job does
          # no git work, so the token has nothing to do here.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostics, log-surface, local-inference and client-contract tests
        run: >-
          npx vitest run
          src/lib/diagnostics
          src/lib/errorTracking.test.ts
          src/stores/logStore.test.ts
          src/stores/sanitizeEvent.test.ts
          src/components/LogsPanel
          src/lib/local-inference
          src/lib/contract
          src/lib/conversation
          src/lib/projection
          src/lib/export
          src/lib/session
          src/lib/audio
          src/lib/provider
          src/providers
          src/stores/providerStore.test.ts
          src/stores/providerStore.readiness.test.ts
          src/stores/turnModeStore.test.ts
          src/stores/routingStore.test.ts
          src/components/providers
          src/components/dev
          src/utils/featureGateForwarding.consistency.test.ts
          electron/squirrel-nuspec.consistency.test.js
          electron/distribution-channel.test.js
          electron/vb-cable-installer.test.js
          electron/vbcable.wiring.test.js
          electron/ipc-channels.test.js
          src/stores/vbCableStore.test.ts
          src/components/VbCable
          src/locales/locales.consistency.test.ts
          electron/store-installer.consistency.test.js
          electron/entry-map.consistency.test.js

  # The sidecar's pytest suite had no CI coverage anywhere (a ledgered slice-3
  # debt, closed here in slice 5) — grep -rl "pytest" .github/ used to return
  # zero hits. Path-gated on sidecar/** (and the one script that consumes its
  # requirements.txt) so app-only PRs don't pay for it. It installs
  # sidecar/requirements.txt, whose pinned linux-x64 sokuji-native wheel DOES
  # resolve on this runner (verified in the job log), so wheel-gated tests run
  # here; what the runner lacks is a GPU and a model cache, so device- and
  # model-gated tests skip (pytest.skip / importorskip) instead of failing —
  # see sidecar/tests/test_accel.py and test_catalog.py.
  sidecar-tests:
    name: sidecar-tests
    runs-on: ubuntu-24.04
    # T3a: least-privilege override -- this job only checks out and runs
    # pytest, never git/write operations, so it needs none of the top-level
    # permissions block's write/write/write escalation.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history: the change-detection step below diffs against the
          # base branch (PR) or previous commit (push), neither of which a
          # shallow checkout can resolve.
          fetch-depth: 0

      - name: Check for sidecar changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$PR_BASE_REF"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          # No resolvable base (new branch's first push, force-push past
          # history, or an event shape without one) — default to running
          # rather than silently skipping.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify -q "$BASE" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(sidecar/|scripts/build-sidecar-bundle\.py|\.github/workflows/sidecar-bundles\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }

      - name: Install sidecar dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pip install -r sidecar/requirements.txt pytest scipy

      - name: Run sidecar tests
        if: steps.changes.outputs.changed == 'true'
        # sokuji_sidecar is not installed as a package; every local invocation runs with
        # PYTHONPATH=sidecar and CI must too, or collection fails on the first import.
        env:
          PYTHONPATH: ${{ github.workspace }}/sidecar
        run: python -m pytest sidecar/tests -q

  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-x64
            name: linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: linux-arm64
            name: linux-arm64
            arch: arm64
          - os: windows-latest
            artifact_name: windows
            name: windows
          - os: macos-26
            artifact_name: macos-arm64
            name: macos-arm64
            arch: arm64
          - os: macos-15-intel
            artifact_name: macos-x64
            name: macos-x64
            arch: x64

    runs-on: ${{ matrix.os }}

    # The Developer ID certificates and the notary key are secrets of the
    # `macos-signing` environment, whose deployment policy admits only `main`
    # and `v*` tags. A pull request's build runs the branch's own code, so it
    # must not hold them: pull requests, other branches and forks build the Mac
    # app with only an ad-hoc signature (scripts/electron-builder-fuses.js), and
    # Developer ID signing is first checked on the push to `main`, before any
    # tag (docs/build/macos-auto-update.md §7.1c).
    environment: ${{ startsWith(matrix.os, 'macos') && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'macos-signing' || '' }}

    # `secrets` cannot be referenced from a step-level `if`; hoisting it here
    # makes the macOS signing steps conditional without tripping the workflow
    # validator (an invalid file fails the whole run before anything executes).
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_DEVID_APP_P12 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history for releases (changelog generation). Use string '0'
          # because numeric 0 is falsy in GitHub Actions expressions.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || 1 }}
          # This job runs `npm ci` and `npm run build` on the checked-out tree,
          # so lifecycle scripts from a dependency could read a token left in
          # .git/config. It does no git work itself. Same reason as the test job.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Feature gates decide which providers get compiled into the artifact, and
      # an unset one expands to the empty string, which reads as "off" — silently.
      # v0.36.3 shipped with the whole Kizuna family missing that way. Printing
      # the resolved values means the log answers "what does this build offer?"
      # without reverse-engineering the bundle. `toJSON(vars)` needs no list to
      # keep in step, and variables are not redacted the way secrets are.
      #
      # Passed through `env:` rather than interpolated into `run:` — a value
      # containing a quote would otherwise break out of the shell command.
      - name: Show resolved feature gates
        env:
          RESOLVED_VARS: ${{ toJSON(vars) }}
        run: echo "$RESOLVED_VARS"

      - name: Build React app
        run: npm run build
        env:
          CI: false
          # Use production environment variables for releases, simpler ones for CI
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji.kizuna.ai' }}
          VITE_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}
          VITE_ENABLED_PROVIDERS: ${{ vars.VITE_ENABLED_PROVIDERS }}
          # Additional variables only for releases
          VITE_ENABLE_DEBUG: ${{ startsWith(github.ref, 'refs/tags/v') && 'false' || '' }}
          VITE_ENABLE_ANALYTICS: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || '' }}
          VITE_EXTENSION_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.VITE_EXTENSION_ID_PROD || '' }}

      # Lindera's wasm (1.8 MB) ships in the build, as browser stores require of
      # code; its IPADIC dictionary (10.5 MB, data) is downloaded on first use of
      # Japanese readings. Check the build has the one and not the other.
      - name: Check the Lindera wasm is in, and its dictionary out of, the app build
        run: node scripts/check-lindera-assets.mjs build

      # The capture helper is a build artifact, not a committed binary. It has
      # to exist before packaging: both packagers copy `resources/` wholesale,
      # so a missing helper ships an app that silently cannot capture a single
      # application (it falls back to whole-system audio).
      - name: Set up MSVC (Windows helper)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the capture helper (Windows)
        if: runner.os == 'Windows'
        run: npm run build:audio-host

      - name: Build the capture helper (macOS)
        if: runner.os == 'macOS'
        run: npm run build:audio-host

      # Fail the build rather than ship a packaged app whose helper is missing:
      # that failure is invisible at runtime, which is exactly how it would
      # reach users.
      - name: Verify the helper was produced
        if: runner.os == 'Windows'
        shell: bash
        run: test -f resources/bin/win32-x64/sokuji-audio-host.exe

      - name: Verify the helper was produced
        if: runner.os == 'macOS'
        run: |
          test -f resources/bin/darwin-arm64/sokuji-audio-host
          test -f resources/bin/darwin-x64/sokuji-audio-host

      # Sign the Windows helper before it is packaged. Unsigned and new with each
      # release, it has no reputation, so Smart App Control blocks it and
      # capturing a single application quietly stops working on those PCs; the
      # Microsoft Store also wants every PE file in the package signed. It is
      # built above from our own source (native/audio-host/win), which SignPath
      # Foundation lets us sign, and Squirrel leaves a signed file as it is.
      # The artifact configuration is .signpath/artifact-configurations/audio-host.xml;
      # the variable names its slug in SignPath, and until it is set a release
      # ships the helper unsigned, with a warning.
      - name: Upload the helper for signing (Windows)
        id: upload-audio-host
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'kizuna-ai-lab/sokuji' && vars.SIGNPATH_AUDIO_HOST_CONFIGURATION_SLUG != ''
        uses: actions/upload-artifact@v6
        with:
          name: windows-audio-host-unsigned
          path: resources/bin/win32-x64/sokuji-audio-host.exe

      - name: Sign the helper (Windows)
        if: steps.upload-audio-host.outcome == 'success'
        # Pinned: this step hands it the SignPath API token.
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_AUDIO_HOST_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-audio-host.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: audio-host-signed/
          wait-for-completion-timeout-in-seconds: 3600

      - name: Put the signed helper in place (Windows)
        if: steps.upload-audio-host.outcome == 'success'
        shell: pwsh
        run: |
          $signed = 'audio-host-signed/sokuji-audio-host.exe'
          $s = Get-AuthenticodeSignature $signed
          if ($s.Status -ne 'Valid') { throw "SignPath returned an unsigned helper: $($s.Status)" }
          if ($s.SignerCertificate.Subject -notmatch '(^|, )CN=SignPath Foundation(,|$)') { throw "Unexpected signer: $($s.SignerCertificate.Subject)" }
          Copy-Item $signed resources/bin/win32-x64/sokuji-audio-host.exe -Force
          "Helper signed by $($s.SignerCertificate.Subject)"

      - name: Warn that the helper ships unsigned (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_AUDIO_HOST_CONFIGURATION_SLUG == ''
        shell: bash
        run: echo "::warning::SIGNPATH_AUDIO_HOST_CONFIGURATION_SLUG is not set, so sokuji-audio-host.exe ships unsigned and Smart App Control will block it."

      - name: Build Electron app with Forge
        if: runner.os == 'Windows'
        run: npx electron-forge make --arch=${{ matrix.arch || 'x64' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          # Prevent actual publishing during CI builds
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ !startsWith(github.ref, 'refs/tags/v') && 'false' || '' }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji.kizuna.ai' }}
          VITE_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}
          VITE_ENABLED_PROVIDERS: ${{ vars.VITE_ENABLED_PROVIDERS }}

      # The Microsoft Store's installer (spec 2026-10-17 §6): the same packaged
      # app plus resources/distribution.json, which turns the one-click VB-CABLE
      # install into a link (Store policy 10.2.3). maker-squirrel always writes
      # out/make/squirrel.windows/x64, so the website's installer moves aside
      # first. Every Windows build runs it, so a PR proves it still works; only
      # a tag uploads.
      - name: Make the Microsoft Store installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ARCH='${{ matrix.arch || 'x64' }}'
          mv out/make out/make-web
          shopt -s nullglob
          APP_DIRS=(out/*-win32-"$ARCH")
          if [ "${#APP_DIRS[@]}" -ne 1 ] || [ ! -d "${APP_DIRS[0]}/resources" ]; then
            echo "Expected one packaged app under out/*-win32-$ARCH, found: ${APP_DIRS[*]:-none}" >&2
            exit 1
          fi
          printf '%s\n' '{"channel":"store"}' > "${APP_DIRS[0]}/resources/distribution.json"
          npx electron-forge make --arch="$ARCH" --from-package
          # The two installers differ by the marker alone, and Setup.exe's size
          # is padded, so their sizes cannot tell them apart: read the packages.
          python - "out/make/squirrel.windows/x64" "out/make-web/squirrel.windows/x64" <<'EOF'
          import glob, sys, zipfile
          def has_marker(folder):
              [nupkg] = glob.glob(folder + '/*-full.nupkg')
              return any(name.endswith('resources/distribution.json') for name in zipfile.ZipFile(nupkg).namelist())
          if not has_marker(sys.argv[1]) or has_marker(sys.argv[2]):
              sys.exit('Only the Store package may carry resources/distribution.json')
          EOF
          mkdir -p out/installers
          cp "out/make-web/squirrel.windows/x64/Sokuji-${VERSION} Setup.exe" out/installers/
          cp "out/make/squirrel.windows/x64/Sokuji-${VERSION} Setup.exe" "out/installers/Sokuji-${VERSION}-store-installer.exe"
          ls -la out/installers

      # electron-builder bundles an x86_64-only `fpm` for building .deb packages.
      # On the arm64 runner, install `fpm` via Ruby gem and tell electron-builder
      # to use it via USE_SYSTEM_FPM.
      - name: Install system fpm (arm64 only)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Build Linux packages (electron-builder)
        if: runner.os == 'Linux'
        # --publish never: the CI's `release` job uploads artifacts via
        # softprops/action-gh-release. electron-builder auto-publishes on tag
        # builds when GH_TOKEN is set (default policy onTagOrDraft + GitHub
        # provider configured in package.json), which would race with the
        # release job and create duplicate releases. Keep publishing in one
        # place. package.json's `build.publish` is retained because it is
        # still required for `latest-linux*.yml` generation during the build.
        run: npx electron-builder --linux AppImage deb --${{ matrix.arch || 'x64' }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          # Must be literal 'false' (not empty string) on x64 — electron-builder
          # reads this via `(USE_SYSTEM_FPM ?? "false") !== "false"`, and an
          # empty string passes that check (truthy) which skips the bundled-fpm
          # download and then fails on missing system `fpm`.
          USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' && 'true' || 'false' }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji.kizuna.ai' }}
          VITE_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}
          VITE_ENABLED_PROVIDERS: ${{ vars.VITE_ENABLED_PROVIDERS }}

      # electron-builder discovers signing identities with `security find-identity -v`
      # and carries on unsigned when it finds none, so check here, before the build,
      # that both Developer ID identities are valid in the shape it will see them.
      # The .p12 files hold only the leaf certificates. Both are issued by Apple's
      # "Developer ID Certification Authority" G2 intermediate, and without it in a
      # keychain neither identity is valid. Runner images normally ship it; if one
      # does not, it is installed from apple.com and pinned by SHA-256.
      # See docs/build/macos-auto-update.md §7.1c.
      - name: Check the Developer ID signing identities (macOS)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        # curl and notarytool talk to Apple with no timeout of their own.
        timeout-minutes: 10
        env:
          MACOS_DEVID_APP_P12: ${{ secrets.MACOS_DEVID_APP_P12 }}
          MACOS_DEVID_INSTALLER_P12: ${{ secrets.MACOS_DEVID_INSTALLER_P12 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          G2_SHA256=F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A
          INTERMEDIATES=$( { security find-certificate -a -Z -c "Developer ID Certification Authority" || true
            security find-certificate -a -Z -c "Developer ID Certification Authority" /Library/Keychains/System.keychain || true; } 2>/dev/null)
          if grep -Fq "SHA-256 hash: $G2_SHA256" <<<"$INTERMEDIATES"; then
            echo "OK: the Developer ID G2 intermediate is already installed."
          else
            curl -fsSL --max-time 60 --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
            GOT=$(shasum -a 256 "$RUNNER_TEMP/DeveloperIDG2CA.cer" | awk '{ print toupper($1) }')
            if [ "$GOT" != "$G2_SHA256" ]; then
              echo "FAIL: the downloaded Developer ID G2 intermediate has SHA-256 $GOT, expected $G2_SHA256." >&2
              exit 1
            fi
            sudo security add-certificates -k /Library/Keychains/System.keychain "$RUNNER_TEMP/DeveloperIDG2CA.cer"
            echo "OK: installed the Developer ID G2 intermediate."
          fi

          # A scratch keychain, as electron-builder makes its own from CSC_LINK and
          # CSC_INSTALLER_LINK at build time: the default search list holds neither.
          SCRATCH="$RUNNER_TEMP/devid-check.keychain"
          trap 'security delete-keychain "$SCRATCH" 2>/dev/null || true; rm -f "$RUNNER_TEMP"/devid-check-*' EXIT
          security create-keychain -p check "$SCRATCH"
          security unlock-keychain -p check "$SCRATCH"
          security set-keychain-settings "$SCRATCH"
          (umask 077 && printf '%s' "$MACOS_DEVID_APP_P12" | base64 --decode > "$RUNNER_TEMP/devid-check-app.p12")
          (umask 077 && printf '%s' "$MACOS_DEVID_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/devid-check-installer.p12")
          for P12 in "$RUNNER_TEMP/devid-check-app.p12" "$RUNNER_TEMP/devid-check-installer.p12"; do
            security import "$P12" -k "$SCRATCH" -P "$MACOS_DEVID_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild >/dev/null
          done
          IDENTITIES=$(security find-identity -v "$SCRATCH")
          echo "valid identities visible to electron-builder:"
          echo "$IDENTITIES"
          for NAME in "Developer ID Application: jiang zhuo (48ST7Q3ACJ)" "Developer ID Installer: jiang zhuo (48ST7Q3ACJ)"; do
            if ! grep -Fq "\"$NAME\"" <<<"$IDENTITIES"; then
              echo "FAIL: \"$NAME\" is not a valid identity; electron-builder would skip signing." >&2
              exit 1
            fi
          done

          # Notarization: the key must decode to a .p8 and Apple must accept it,
          # or electron-builder fails only after the whole app has been built.
          KEY="$RUNNER_TEMP/devid-check-notary.p8"
          (umask 077 && printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$KEY")
          if [ "$(head -n 1 "$KEY" | tr -d '\r')" != '-----BEGIN PRIVATE KEY-----' ]; then
            echo "FAIL: APPLE_API_KEY_P8 does not decode to an App Store Connect API key (.p8)." >&2
            exit 1
          fi
          xcrun notarytool history --key "$KEY" --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER" --output-format json >/dev/null
          echo "OK: the notary service accepts the App Store Connect API key."

      - name: Build macOS artifacts (electron-builder)
        if: runner.os == 'macOS'
        # notarytool waits on Apple's queue with no timeout of its own, twice per
        # build (app, then pkg). A normal build takes well under this.
        timeout-minutes: 60
        # --publish never: release job uploads artifacts via softprops/action-gh-release
        # to avoid duplicate releases.
        # -c.directories.output: per-platform output dir (build.directories.output is
        # globally set to out/make-linux for the Linux build).
        # The afterPack hook (scripts/electron-builder-fuses.js) ad-hoc signs the .app
        # since CSC_IDENTITY_AUTO_DISCOVERY=false skips signing entirely.
        # Targets must be listed here: a target on the CLI overrides build.mac.target
        # entirely, so `--mac pkg` alone would silently drop the zip -- and with it
        # latest-mac.yml and the blockmap, leaving auto-update dead while everything
        # still looks green. The zip is what electron-updater actually installs.
        run: |
          set -euo pipefail
          # The signing pair is exported here instead of being declared in `env:`
          # below, because an empty-but-defined CSC_LINK is not "unset" to
          # electron-builder: getCscLink() keeps "" on purpose ("allow to specify
          # as empty string"), macPackager guards only `cscLink == null`, and the
          # pkg target forces the keychain open even when the .app itself skips
          # signing. loadCscLink("") then resolves the empty path against the
          # project dir and the build dies with "<projectDir> not a file" -- which
          # is every fork PR, since GitHub passes it no secrets at all (#453).
          # The notary key goes the same way, for its own reason: electron-builder
          # refuses a partial APPLE_API_* set, and the pkg target asks for
          # notarization even when it is unsigned.
          if [ "$HAS_MAC_CERT" = 'true' ]; then
            export CSC_LINK="$MACOS_DEVID_APP_P12" CSC_KEY_PASSWORD="$MACOS_DEVID_P12_PASSWORD"
            export CSC_INSTALLER_LINK="$MACOS_DEVID_INSTALLER_P12" CSC_INSTALLER_KEY_PASSWORD="$MACOS_DEVID_P12_PASSWORD"
            # notarytool reads the App Store Connect API key from a file.
            export APPLE_API_KEY="$RUNNER_TEMP/notary-api-key.p8"
            trap 'rm -f "$APPLE_API_KEY"' EXIT
            (umask 077 && printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY")
            export APPLE_API_KEY_ID="$NOTARY_API_KEY_ID" APPLE_API_ISSUER="$NOTARY_API_ISSUER"
          fi
          npx electron-builder --mac pkg zip --${{ matrix.arch }} --publish never -c.directories.output=out/make-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          # With no certificate configured the build stays ad-hoc signed and
          # macOS auto-update stays off; scripts/electron-builder-fuses.js
          # ad-hoc signs in that case.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_DEVID_APP_P12 != '' && 'true' || 'false' }}
          MACOS_DEVID_APP_P12: ${{ secrets.MACOS_DEVID_APP_P12 }}
          MACOS_DEVID_INSTALLER_P12: ${{ secrets.MACOS_DEVID_INSTALLER_P12 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji.kizuna.ai' }}
          VITE_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}
          VITE_ENABLED_PROVIDERS: ${{ vars.VITE_ENABLED_PROVIDERS }}

      # electron-builder logs "skipped macOS code signing" or "skipped macOS
      # notarization" and carries on, so an unsigned or unnotarized release would
      # look like a success. An ad-hoc signature yields a cdhash DR, which is
      # exactly what stops Squirrel.Mac from ever accepting an update, and a
      # missing ticket brings back the Gatekeeper refusal -- fail loudly instead.
      - name: Verify the macOS update artifacts (signature + notarization + zip + manifest)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        # stapler and spctl may look tickets up online; each stapler retry loop adds at most 30 s.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          APP=$(find out/make-mac -name 'Sokuji.app' -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "No Sokuji.app found under out/make-mac" >&2
            exit 1
          fi
          DR=$(codesign -d -r- "$APP" 2>&1 | grep 'designated =>' | sed 's/^#* *designated => //')
          echo "designated requirement: $DR"
          case "$DR" in
            *cdhash*)
              echo "FAIL: ad-hoc signature (cdhash DR). Signing was skipped --" >&2
              echo "the Developer ID identity was probably not discoverable via find-identity -v." >&2
              exit 1 ;;
          esac
          if ! grep -Fq 'identifier "ai.kizunaai.sokuji"' <<<"$DR" || \
             ! grep -Fq 'anchor apple generic' <<<"$DR" || \
             ! grep -Eq 'certificate leaf\[subject\.OU\] = ("48ST7Q3ACJ"|48ST7Q3ACJ([) ]|$))' <<<"$DR"; then
            echo "FAIL: not the Developer ID designated requirement for team 48ST7Q3ACJ." >&2
            exit 1
          fi
          # Captured first, then grepped: under `pipefail` a `codesign | grep -q`
          # pipeline fails whenever grep matches early and codesign takes the
          # SIGPIPE, so a passing bundle would be reported as FAIL at random.
          SIGNATURE=$(codesign -dvv "$APP" 2>&1)
          if ! grep -Fxq 'Authority=Developer ID Application: jiang zhuo (48ST7Q3ACJ)' <<<"$SIGNATURE" || \
             ! grep -Fxq 'TeamIdentifier=48ST7Q3ACJ' <<<"$SIGNATURE"; then
            echo "FAIL: not signed with Developer ID Application: jiang zhuo (48ST7Q3ACJ)." >&2
            echo "$SIGNATURE" >&2
            exit 1
          fi
          echo "OK: signed with Developer ID, team 48ST7Q3ACJ."
          codesign --verify --deep --strict "$APP"
          echo "OK: bundle passes strict nested validation."

          # Gatekeeper's verdict, from the ticket stapled to the app, so the first
          # open needs no network and no xattr. spctl reports "security disabled"
          # rather than a source when assessments are off on the runner; the
          # stapled ticket is then the proof.
          # `stapler validate` also looks the ticket up with Apple's CloudKit
          # service, and that lookup can drop on a runner ("The network
          # connection was lost", exit 68) for a correctly stapled file, so it
          # is retried before the build fails.
          stapled() {
            local ATTEMPT
            for ATTEMPT in 1 2 3; do
              xcrun stapler validate "$1" && return 0
              [ "$ATTEMPT" -lt 3 ] || break
              echo "::warning::stapler validate $(basename "$1") failed (attempt $ATTEMPT); retrying in 15 s."
              sleep 15
            done
            echo "FAIL: $(basename "$1") has no valid stapled notarization ticket." >&2
            return 1
          }
          stapled "$APP"
          assess() {
            local OUT
            OUT=$(spctl --assess --type "$1" -vv "$2" 2>&1) || { echo "FAIL: Gatekeeper rejects $2:" >&2; echo "$OUT" >&2; return 1; }
            echo "$OUT"
            if grep -Fq 'override=security disabled' <<<"$OUT"; then
              echo "::warning::Gatekeeper assessments are disabled on this runner; relying on the stapled ticket for $(basename "$2")."
            elif ! grep -Fxq 'source=Notarized Developer ID' <<<"$OUT"; then
              echo "FAIL: Gatekeeper does not see $2 as notarized." >&2
              return 1
            fi
          }
          assess execute "$APP"
          echo "OK: the app is notarized and stapled."

          # The Hardened Runtime (electron-builder's default, so every
          # certificate-signed build has it) denies the microphone outright --
          # no TCC prompt, no error, getUserMedia just rejects -- unless the
          # bundle carries com.apple.security.device.audio-input. electron-builder's
          # own entitlements template does not, which is how v0.39.1 shipped with
          # a microphone that could not be turned on from Finder (#458). Check
          # every nested bundle: the renderer helper is the process that actually
          # opens the device.
          grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<<"$SIGNATURE" || {
            echo "FAIL: the app is not signed with the Hardened Runtime; build.mac.hardenedRuntime drifted." >&2
            echo "$SIGNATURE" >&2
            exit 1; }
          for BUNDLE in "$APP" "$APP"/Contents/Frameworks/*.app; do
            ENTITLEMENTS=$(codesign -d --entitlements - "$BUNDLE" 2>/dev/null)
            if ! grep -q 'com.apple.security.device.audio-input' <<<"$ENTITLEMENTS"; then
              echo "FAIL: $(basename "$BUNDLE") lacks com.apple.security.device.audio-input --" >&2
              echo "the microphone would be denied with no prompt (#458)." >&2
              exit 1
            fi
          done
          echo "OK: Hardened Runtime with the audio-input entitlement on every bundle."

          # MacUpdater installs the zip and nothing else -- it rejects pkg and dmg
          # outright -- and only the zip target emits latest-mac.yml plus the
          # blockmap. Missing either one leaves auto-update dead with a green build.
          ZIP=$(find out/make-mac -maxdepth 1 -name '*.zip' | head -1)
          YML=out/make-mac/latest-mac.yml
          [ -n "$ZIP" ] || { echo "FAIL: no macOS .zip produced; electron-updater has nothing to install." >&2; exit 1; }
          [ -f "$YML" ] || { echo "FAIL: no latest-mac.yml produced." >&2; exit 1; }
          echo "OK: $(basename "$ZIP")"
          echo "--- latest-mac.yml ---"
          cat "$YML"
          grep -q "$(basename "$ZIP")" "$YML" || {
            echo "FAIL: latest-mac.yml does not reference $(basename "$ZIP")." >&2; exit 1; }
          echo "OK: manifest references the zip."

          # The zip is what Squirrel.Mac installs, so check the app inside it. An
          # installed v0.46.4 -- the bridge release, docs/build/macos-auto-update.md
          # §7.1b -- installs it only if it satisfies 0.46.4's own designated
          # requirement, copied verbatim from `codesign -d -r-` on an installed copy.
          BRIDGE_REQUIREMENT='identifier "ai.kizunaai.sokuji" and (certificate root = H"92e86a47b9d0179e060c7e7cea61b8f9d4f3c350" or anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "48ST7Q3ACJ")'
          UNZIPPED="$RUNNER_TEMP/zip-check"
          rm -rf "$UNZIPPED"
          mkdir -p "$UNZIPPED"
          ditto -x -k "$ZIP" "$UNZIPPED"
          [ -d "$UNZIPPED/Sokuji.app" ] || { echo "FAIL: no Sokuji.app at the top of $(basename "$ZIP")." >&2; exit 1; }
          if ! codesign --verify --deep --strict --test-requirement="=$BRIDGE_REQUIREMENT" "$UNZIPPED/Sokuji.app"; then
            echo "FAIL: an installed v0.46.4 would refuse this update." >&2
            exit 1
          fi
          stapled "$UNZIPPED/Sokuji.app"
          echo "OK: the zip's app is stapled, and installed v0.46.4 accepts it as an update."

          # The pkg is what a new user downloads and opens.
          PKG=$(find out/make-mac -maxdepth 1 -name '*.pkg' | head -1)
          [ -n "$PKG" ] || { echo "FAIL: no macOS .pkg produced." >&2; exit 1; }
          PKG_SIGNATURE=$(pkgutil --check-signature "$PKG" 2>&1) || {
            echo "FAIL: the pkg is not signed." >&2; echo "$PKG_SIGNATURE" >&2; exit 1; }
          echo "$PKG_SIGNATURE"
          if ! grep -Fq 'Developer ID Installer: jiang zhuo (48ST7Q3ACJ)' <<<"$PKG_SIGNATURE"; then
            echo "FAIL: the pkg is not signed with Developer ID Installer: jiang zhuo (48ST7Q3ACJ)." >&2
            exit 1
          fi
          stapled "$PKG"
          assess install "$PKG"
          echo "OK: the pkg is signed with Developer ID Installer, notarized and stapled."

      # A signing change can only be judged on a real Mac (Gatekeeper, TCC,
      # the keychain, Squirrel's requirement check). Pull requests build ad-hoc,
      # so keep the signed app and installer of each push to `main` around long
      # enough to try them before a tag is cut.
      - name: Upload the signed macOS app for review (main)
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_MAC_CERT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}-main-build
          path: |
            out/make-mac/*.zip
            out/make-mac/*.pkg
          retention-days: 3
          if-no-files-found: error

      - name: Build Chrome Extension
        if: matrix.os == 'ubuntu-latest' && matrix.arch != 'arm64'
        run: |
          cd extension
          npm ci
          # Build extension with production mode for releases
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            NODE_ENV=production npm run build -- --mode production
            cd dist
            zip -r "../sokuji-extension-${VERSION}.zip" *
            cd ..
          else
            npm run build
            # Verify the build output exists
            if [ ! -d "dist" ]; then
              echo "Extension build failed: dist directory not found"
              exit 1
            fi
          fi
        env:
          # Production environment variables for extension
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji.kizuna.ai' }}
          POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}
          VITE_ENABLED_PROVIDERS: ${{ vars.VITE_ENABLED_PROVIDERS }}

      - name: Check the Lindera wasm is in, and its dictionary out of, the extension build
        if: matrix.os == 'ubuntu-latest' && matrix.arch != 'arm64'
        run: node scripts/check-lindera-assets.mjs extension/dist

      # Release-specific steps
      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'linux-x64'
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s")
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s")
          fi
          # Save changelog to a file for the release
          echo "$CHANGELOG" > CHANGELOG.md

      - name: Upload Linux x64 artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-artifacts
          path: |
            out/make-linux/*.AppImage
            out/make-linux/*.deb
            out/make-linux/latest-linux.yml
            extension/sokuji-extension-*.zip
            CHANGELOG.md

      - name: Upload Linux ARM64 artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'linux-arm64'
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-artifacts
          path: |
            out/make-linux/*.AppImage
            out/make-linux/*.deb
            out/make-linux/latest-linux-arm64.yml

      - name: Upload unsigned Windows installers for signing
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: windows-unsigned
          # Both at the zip's root, where SignPath's two patterns look.
          path: out/installers/*.exe

      - name: Upload Windows nupkg and RELEASES for release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: windows-nupkg
          # RELEASES names the nupkg with its SHA1 and size. The installed
          # app's Update.exe reads it from the release's download URL and
          # verifies the package against it (electron/squirrel-update.js).
          path: |
            out/make-web/squirrel.windows/x64/*.nupkg
            out/make-web/squirrel.windows/x64/RELEASES
          # Without RELEASES no installed app can update: a tag build that
          # lost it must fail here, not ship.
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-artifacts
          path: |
            out/make-mac/*.pkg
            out/make-mac/*.zip
            out/make-mac/*.blockmap
            out/make-mac/latest-mac.yml

  sign-windows:
    name: Sign Windows artifacts
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'kizuna-ai-lab/sokuji'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # This job only signs artifacts downloaded from the build job;
          # it does no git work, so the token has nothing to do here.
          persist-credentials: false

      - name: Download unsigned artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-unsigned
          path: unsigned/

      # SignPath requires a github-artifact-id from upload-artifact.
      # We must re-upload because the original upload happened in a different job
      # and artifact IDs cannot be passed across jobs without explicit output wiring.
      - name: Upload for SignPath
        id: upload-for-signing
        uses: actions/upload-artifact@v6
        with:
          name: windows-to-sign
          path: unsigned/
          overwrite: true

      - name: Submit signing request
        id: sign
        # Pinned: this step hands it the SignPath API token.
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: default
          github-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/
          wait-for-completion-timeout-in-seconds: 3600

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-signed
          path: signed/

  release:
    # Only run for tag pushes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-x64-artifacts
          path: linux-x64-artifacts

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-arm64-artifacts
          path: linux-arm64-artifacts

      - name: Download signed Windows installer
        uses: actions/download-artifact@v7
        with:
          name: windows-signed
          path: windows-signed

      - name: Download Windows nupkg
        uses: actions/download-artifact@v7
        with:
          name: windows-nupkg
          path: windows-nupkg

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-artifacts
          path: macos-arm64-artifacts

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-x64-artifacts
          path: macos-x64-artifacts

      - name: Debug artifacts structure
        run: |
          echo "=== Linux x64 ==="
          find linux-x64-artifacts -type f || true
          echo "=== Linux ARM64 ==="
          find linux-arm64-artifacts -type f || true
          echo "=== Windows (signed) ==="
          find windows-signed -type f || true
          echo "=== Windows (nupkg) ==="
          find windows-nupkg -type f || true
          echo "=== macOS ARM64 ==="
          find macos-arm64-artifacts -type f || true
          echo "=== macOS x64 ==="
          find macos-x64-artifacts -type f || true

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find linux-x64-artifacts -name "*.deb" -exec cp {} release-assets/ \;
          find linux-x64-artifacts -name "*.AppImage" -exec cp {} release-assets/ \;
          find linux-x64-artifacts -name "latest-linux.yml" -exec cp {} release-assets/ \;
          find linux-x64-artifacts -name "sokuji-extension-*.zip" -exec cp {} release-assets/ \;
          find linux-arm64-artifacts -name "*.deb" -exec cp {} release-assets/ \;
          find linux-arm64-artifacts -name "*.AppImage" -exec cp {} release-assets/ \;
          find linux-arm64-artifacts -name "latest-linux-arm64.yml" -exec cp {} release-assets/ \;
          find windows-signed -name "*.exe" -exec cp {} release-assets/ \;
          find windows-nupkg -name "*.nupkg" -exec cp {} release-assets/ \;
          find windows-nupkg -name "RELEASES" -exec cp {} release-assets/ \;
          find macos-arm64-artifacts -name "*.pkg" -exec cp {} release-assets/ \;
          find macos-x64-artifacts -name "*.pkg" -exec cp {} release-assets/ \;
          # The zip is what electron-updater installs on macOS: MacUpdater accepts
          # only a zip and rejects pkg/dmg outright. The blockmap next to it is what
          # makes subsequent updates differential.
          find macos-arm64-artifacts -name "*.zip" -exec cp {} release-assets/ \;
          find macos-x64-artifacts -name "*.zip" -exec cp {} release-assets/ \;
          find macos-arm64-artifacts -name "*.blockmap" -exec cp {} release-assets/ \;
          find macos-x64-artifacts -name "*.blockmap" -exec cp {} release-assets/ \;
          # Squirrel generates filenames with spaces (e.g. "Sokuji-0.15.12 Setup.exe").
          # Rename to use dots so asset names are consistent and latest.yml URLs match.
          cd release-assets
          for f in *' '*; do
            [ -e "$f" ] || continue
            mv "$f" "${f// /.}"
          done
          cd ..
          # The Microsoft Store's installer travels with the release: the Store
          # downloads it through sokuji-backend's pinned route. Fail rather than
          # publish a release the Store submission cannot point at, or one whose
          # installers came back without a signature.
          if [ -z "$(find release-assets -name '*-store-installer.exe')" ]; then
            echo "The Store installer is missing from the signed artifacts" >&2
            exit 1
          fi
          # An Authenticode signature sits in the PE certificate table (optional-
          # header data directory 4). This job has no checkout and no
          # osslsigncode, so a non-empty entry is the check: it tells a signed
          # installer from one SignPath never touched.
          python3 -I - release-assets/*.exe <<'EOF'
          import struct, sys
          unsigned = []
          for path in sys.argv[1:]:
              data = open(path, 'rb').read()
              pe = struct.unpack_from('<I', data, 0x3C)[0]
              optional = pe + 24
              directories = optional + (96 if struct.unpack_from('<H', data, optional)[0] == 0x10B else 112)
              _offset, size = struct.unpack_from('<II', data, directories + 4 * 8)
              if data[pe:pe + 4] != b'PE\0\0' or size == 0:
                  unsigned.append(path)
          for path in unsigned:
              print(f'Not signed: {path}', file=sys.stderr)
          sys.exit(1 if unsigned else 0)
          EOF
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Generate latest.yml for auto-updater
        run: |
          # The website's installer only: the Store's must never reach the updater.
          mapfile -t EXES < <(find release-assets -name "*.Setup.exe")
          if [ "${#EXES[@]}" -ne 1 ]; then
            echo "Expected one *.Setup.exe, found ${#EXES[@]}: ${EXES[*]:-none}" >&2
            exit 1
          fi
          EXE_FILE=${EXES[0]}

          EXE_NAME=$(basename "$EXE_FILE")
          VERSION=${GITHUB_REF_NAME#v}
          SHA512=$(openssl dgst -sha512 -binary "$EXE_FILE" | openssl base64 -A)
          SIZE=$(stat -c%s "$EXE_FILE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          {
            echo "version: ${VERSION}"
            echo "files:"
            echo "  - url: ${EXE_NAME}"
            echo "    sha512: ${SHA512}"
            echo "    size: ${SIZE}"
            echo "path: ${EXE_NAME}"
            echo "sha512: ${SHA512}"
            echo "releaseDate: '${DATE}'"
          } > release-assets/latest.yml

          echo "=== latest.yml ==="
          cat release-assets/latest.yml

      - name: Merge the per-arch latest-mac.yml files
        # The zip target sets isWriteUpdateInfo, so electron-builder now writes a
        # correct latest-mac.yml itself -- no hand-rolled sha512 loop any more.
        # But each arch runner writes its own, and electron-updater fetches a
        # single latest-mac.yml (no arch suffix), so the two files[] lists have
        # to be combined. MacUpdater then picks the entry matching process.arch.
        run: |
          set -euo pipefail
          ARM=$(find macos-arm64-artifacts -name latest-mac.yml | head -1)
          X64=$(find macos-x64-artifacts -name latest-mac.yml | head -1)
          if [ -z "$ARM" ] && [ -z "$X64" ]; then
            echo "No latest-mac.yml produced -- macOS auto-update will not work."
            echo "That is expected when MACOS_DEVID_APP_P12 is unset (unsigned build)."
            exit 0
          fi
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          ZIP=$(find macos-arm64-artifacts macos-x64-artifacts -name '*.zip' 2>/dev/null | head -1)
          python3 - "$ARM" "$X64" "$ZIP" <<'PY'
          import plistlib, re, sys, yaml, zipfile
          paths = [p for p in sys.argv[1:3] if p]
          docs = [yaml.safe_load(open(p)) for p in paths]
          # Prefer arm64 for the top-level path/sha512 fields, matching what the
          # previous hand-rolled step produced.
          primary = next((d for p, d in zip(paths, docs) if 'arm64' in p), docs[0])
          seen, files = set(), []
          for d in docs:
              for f in d.get('files', []):
                  if f['url'] not in seen:
                      seen.add(f['url'])
                      files.append(f)
          merged = dict(primary)
          merged['files'] = files
          # electron-builder leaves the app's minimum macOS out of latest-mac.yml,
          # so an install below it would be offered a build that cannot launch
          # (Electron 44 raised it to 13.0). electron-updater's
          # checkIfUpdateSupported compares os.release() -- the Darwin version --
          # against minimumSystemVersion, so the floor goes in as Darwin. A floor
          # missing from the map fails here rather than shipping without a gate.
          DARWIN_FOR_MACOS = {'13.0': '22.0.0'}
          with zipfile.ZipFile(sys.argv[3]) as z:
              name = next(n for n in z.namelist() if re.fullmatch(r'[^/]+\.app/Contents/Info\.plist', n))
              min_macos = plistlib.loads(z.read(name))['LSMinimumSystemVersion']
          if min_macos not in DARWIN_FOR_MACOS:
              sys.exit(f'LSMinimumSystemVersion {min_macos} has no Darwin entry in DARWIN_FOR_MACOS')
          merged['minimumSystemVersion'] = DARWIN_FOR_MACOS[min_macos]
          with open('release-assets/latest-mac.yml', 'w') as fh:
              yaml.safe_dump(merged, fh, default_flow_style=False, sort_keys=False)
          PY
          echo "=== latest-mac.yml ==="
          cat release-assets/latest-mac.yml

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: linux-x64-artifacts/CHANGELOG.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
