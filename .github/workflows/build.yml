name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  # No workflow ran vitest before this one, so `npm run build` (plain
  # `vite build`, no tsc) was the only gate and a consistency test could not
  # fail CI. That is what let the LogsPanel copy-export defect and the
  # console/logStore drift in #441 survive.
  #
  # Deliberately scoped rather than the whole suite: the full run has
  # pre-existing failures unrelated to these files, and a job that is red on
  # arrival gets ignored. Widen it as suites are cleaned up — the value is in
  # the diagnostics guards running on every PR, starting now.
  test:
    name: test (diagnostics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `npm ci` runs lifecycle scripts from this checkout, and this job does
          # no git work, so the token has nothing to do here.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostics and log-surface tests
        run: >-
          npx vitest run
          src/lib/diagnostics
          src/lib/errorTracking.test.ts
          src/stores/logStore.test.ts
          src/stores/sanitizeEvent.test.ts
          src/components/LogsPanel

  # The sidecar's pytest suite had no CI coverage anywhere (a ledgered slice-3
  # debt, closed here in slice 5) — grep -rl "pytest" .github/ used to return
  # zero hits. Path-gated on sidecar/** (and the one script that consumes its
  # requirements.txt) so app-only PRs don't pay for it. Runs wheel-less
  # (no sokuji-native installed, unlike the dev .venv setup.sh builds): the
  # handful of tests that need the real native wheel skip via
  # pytest.importorskip("sokuji_native") instead of failing — see
  # sidecar/tests/test_accel.py and test_catalog.py.
  sidecar-tests:
    name: sidecar-tests
    runs-on: ubuntu-24.04
    # T3a: least-privilege override -- this job only checks out and runs
    # pytest, never git/write operations, so it needs none of the top-level
    # permissions block's write/write/write escalation.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history: the change-detection step below diffs against the
          # base branch (PR) or previous commit (push), neither of which a
          # shallow checkout can resolve.
          fetch-depth: 0

      - name: Check for sidecar changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$PR_BASE_REF"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          # No resolvable base (new branch's first push, force-push past
          # history, or an event shape without one) — default to running
          # rather than silently skipping.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify -q "$BASE" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(sidecar/|scripts/build-sidecar-bundle\.py|\.github/workflows/sidecar-bundles\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }

      - name: Install sidecar dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pip install -r sidecar/requirements.txt pytest scipy

      - name: Run sidecar tests
        if: steps.changes.outputs.changed == 'true'
        run: python -m pytest sidecar/tests -q

  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-x64
            name: linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: linux-arm64
            name: linux-arm64
            arch: arm64
          - os: windows-latest
            artifact_name: windows
            name: windows
          - os: macos-26
            artifact_name: macos-arm64
            name: macos-arm64
            arch: arm64
          - os: macos-15-intel
            artifact_name: macos-x64
            name: macos-x64
            arch: x64

    runs-on: ${{ matrix.os }}

    # `secrets` cannot be referenced from a step-level `if`; hoisting it here
    # makes the macOS signing steps conditional without tripping the workflow
    # validator (an invalid file fails the whole run before anything executes).
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CSC_LINK != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history for releases (changelog generation). Use string '0'
          # because numeric 0 is falsy in GitHub Actions expressions.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || 1 }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Feature gates decide which providers get compiled into the artifact, and
      # an unset one expands to the empty string, which reads as "off" — silently.
      # v0.36.3 shipped with the whole Kizuna family missing that way. Printing
      # the resolved values means the log answers "what does this build offer?"
      # without reverse-engineering the bundle. `toJSON(vars)` needs no list to
      # keep in step, and variables are not redacted the way secrets are.
      #
      # Passed through `env:` rather than interpolated into `run:` — a value
      # containing a quote would otherwise break out of the shell command.
      - name: Show resolved feature gates
        env:
          RESOLVED_VARS: ${{ toJSON(vars) }}
        run: echo "$RESOLVED_VARS"

      - name: Build React app
        run: npm run build
        env:
          CI: false
          # Use production environment variables for releases, simpler ones for CI
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji-api.kizuna.ai' }}
          VITE_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_VOLCENGINE_ST: ${{ vars.VITE_ENABLE_VOLCENGINE_ST }}
          VITE_ENABLE_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_VOLCENGINE_AST2 }}
          VITE_ENABLE_PALABRA_AI: ${{ vars.VITE_ENABLE_PALABRA_AI }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_KIZUNA_SONIOX: ${{ vars.VITE_ENABLE_KIZUNA_SONIOX }}
          VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE: ${{ vars.VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE }}
          VITE_ENABLE_KIZUNA_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_KIZUNA_VOLCENGINE_AST2 }}
          VITE_ENABLE_ZOOM_AI: ${{ vars.VITE_ENABLE_ZOOM_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}
          # Additional variables only for releases
          VITE_ENABLE_DEBUG: ${{ startsWith(github.ref, 'refs/tags/v') && 'false' || '' }}
          VITE_ENABLE_ANALYTICS: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || '' }}
          VITE_EXTENSION_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.VITE_EXTENSION_ID_PROD || '' }}

      # The capture helper is a build artifact, not a committed binary. It has
      # to exist before packaging: both packagers copy `resources/` wholesale,
      # so a missing helper ships an app that silently cannot capture a single
      # application (it falls back to whole-system audio).
      - name: Set up MSVC (Windows helper)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the capture helper (Windows)
        if: runner.os == 'Windows'
        run: npm run build:audio-host

      - name: Build the capture helper (macOS)
        if: runner.os == 'macOS'
        run: npm run build:audio-host

      # Fail the build rather than ship a packaged app whose helper is missing:
      # that failure is invisible at runtime, which is exactly how it would
      # reach users.
      - name: Verify the helper was produced
        if: runner.os == 'Windows'
        shell: bash
        run: test -f resources/bin/win32-x64/sokuji-audio-host.exe

      - name: Verify the helper was produced
        if: runner.os == 'macOS'
        run: |
          test -f resources/bin/darwin-arm64/sokuji-audio-host
          test -f resources/bin/darwin-x64/sokuji-audio-host

      - name: Build Electron app with Forge
        if: runner.os == 'Windows'
        run: npx electron-forge make --arch=${{ matrix.arch || 'x64' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          # Prevent actual publishing during CI builds
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ !startsWith(github.ref, 'refs/tags/v') && 'false' || '' }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji-api.kizuna.ai' }}
          VITE_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_VOLCENGINE_ST: ${{ vars.VITE_ENABLE_VOLCENGINE_ST }}
          VITE_ENABLE_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_VOLCENGINE_AST2 }}
          VITE_ENABLE_PALABRA_AI: ${{ vars.VITE_ENABLE_PALABRA_AI }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_KIZUNA_SONIOX: ${{ vars.VITE_ENABLE_KIZUNA_SONIOX }}
          VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE: ${{ vars.VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE }}
          VITE_ENABLE_KIZUNA_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_KIZUNA_VOLCENGINE_AST2 }}
          VITE_ENABLE_ZOOM_AI: ${{ vars.VITE_ENABLE_ZOOM_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}

      # electron-builder bundles an x86_64-only `fpm` for building .deb packages.
      # On the arm64 runner, install `fpm` via Ruby gem and tell electron-builder
      # to use it via USE_SYSTEM_FPM.
      - name: Install system fpm (arm64 only)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Build Linux packages (electron-builder)
        if: runner.os == 'Linux'
        # --publish never: the CI's `release` job uploads artifacts via
        # softprops/action-gh-release. electron-builder auto-publishes on tag
        # builds when GH_TOKEN is set (default policy onTagOrDraft + GitHub
        # provider configured in package.json), which would race with the
        # release job and create duplicate releases. Keep publishing in one
        # place. package.json's `build.publish` is retained because it is
        # still required for `latest-linux*.yml` generation during the build.
        run: npx electron-builder --linux AppImage deb --${{ matrix.arch || 'x64' }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          # Must be literal 'false' (not empty string) on x64 — electron-builder
          # reads this via `(USE_SYSTEM_FPM ?? "false") !== "false"`, and an
          # empty string passes that check (truthy) which skips the bundled-fpm
          # download and then fails on missing system `fpm`.
          USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' && 'true' || 'false' }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji-api.kizuna.ai' }}
          VITE_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_VOLCENGINE_ST: ${{ vars.VITE_ENABLE_VOLCENGINE_ST }}
          VITE_ENABLE_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_VOLCENGINE_AST2 }}
          VITE_ENABLE_PALABRA_AI: ${{ vars.VITE_ENABLE_PALABRA_AI }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_KIZUNA_SONIOX: ${{ vars.VITE_ENABLE_KIZUNA_SONIOX }}
          VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE: ${{ vars.VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE }}
          VITE_ENABLE_KIZUNA_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_KIZUNA_VOLCENGINE_AST2 }}
          VITE_ENABLE_ZOOM_AI: ${{ vars.VITE_ENABLE_ZOOM_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}

      # electron-builder discovers signing identities with `security find-identity -v`,
      # and a self-signed certificate is reported CSSMERR_TP_NOT_TRUSTED, so it would
      # be invisible and signing would be silently skipped. Trusting it makes it
      # discoverable. Verified on macOS 26.6.1; see docs/build/macos-auto-update.md.
      #
      # This is NOT notarization and buys nothing with Gatekeeper. Its only job is
      # to give the app a signing identity that stays the same between builds, which
      # is what Squirrel.Mac and TCC key on.
      - name: Trust the self-signed signing certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          # Extract the certificate alone (no private key) for the trust store.
          # OpenSSL 3 needs -legacy to read a p12 exported with legacy algorithms;
          # LibreSSL does not have the flag, so try plain first.
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys \
            -passin "pass:$MACOS_CSC_KEY_PASSWORD" -out "$RUNNER_TEMP/signing.pem" 2>/dev/null || \
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/signing.p12" -clcerts -nokeys \
            -passin "pass:$MACOS_CSC_KEY_PASSWORD" -out "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          # Prove the trust actually took, in the same shape electron-builder
          # will see it: import into a scratch keychain and ask for VALID
          # identities. Checking the default search list here would always say
          # "0 valid identities found" -- nothing is imported into it, since
          # electron-builder makes its own keychain from CSC_LINK at build time.
          SCRATCH="$RUNNER_TEMP/trust-check.keychain"
          security create-keychain -p check "$SCRATCH"
          security unlock-keychain -p check "$SCRATCH"
          security set-keychain-settings "$SCRATCH"
          security import "$RUNNER_TEMP/signing.p12" -k "$SCRATCH" \
            -P "$MACOS_CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k check "$SCRATCH" >/dev/null 2>&1
          echo "valid identities visible to electron-builder:"
          security find-identity -v -p codesigning "$SCRATCH" | sed 's/^/  /'
          if ! security find-identity -v -p codesigning "$SCRATCH" | grep -q "Sokuji Code Signing"; then
            echo "FAIL: the certificate is still not a valid identity after trusting it." >&2
            security delete-keychain "$SCRATCH" || true
            exit 1
          fi
          security delete-keychain "$SCRATCH"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.pem"

      - name: Build macOS artifacts (electron-builder)
        if: runner.os == 'macOS'
        # --publish never: release job uploads artifacts via softprops/action-gh-release
        # to avoid duplicate releases.
        # -c.directories.output: per-platform output dir (build.directories.output is
        # globally set to out/make-linux for the Linux build).
        # The afterPack hook (scripts/electron-builder-fuses.js) ad-hoc signs the .app
        # since CSC_IDENTITY_AUTO_DISCOVERY=false skips signing entirely.
        # Targets must be listed here: a target on the CLI overrides build.mac.target
        # entirely, so `--mac pkg` alone would silently drop the zip -- and with it
        # latest-mac.yml and the blockmap, leaving auto-update dead while everything
        # still looks green. The zip is what electron-updater actually installs.
        run: |
          set -euo pipefail
          # The signing pair is exported here instead of being declared in `env:`
          # below, because an empty-but-defined CSC_LINK is not "unset" to
          # electron-builder: getCscLink() keeps "" on purpose ("allow to specify
          # as empty string"), macPackager guards only `cscLink == null`, and the
          # pkg target forces the keychain open even when the .app itself skips
          # signing. loadCscLink("") then resolves the empty path against the
          # project dir and the build dies with "<projectDir> not a file" -- which
          # is every fork PR, since GitHub passes it no secrets at all (#453).
          if [ "$HAS_MAC_CERT" = 'true' ]; then
            export CSC_LINK="$MACOS_CSC_LINK" CSC_KEY_PASSWORD="$MACOS_CSC_KEY_PASSWORD"
          fi
          npx electron-builder --mac pkg zip --${{ matrix.arch }} --publish never -c.directories.output=out/make-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          # With no certificate configured the build stays ad-hoc signed and
          # macOS auto-update stays off; scripts/electron-builder-fuses.js
          # ad-hoc signs in that case.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CSC_LINK != '' && 'true' || 'false' }}
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          # electron-builder refuses to sign pull-request builds unless this is
          # set, so that untrusted forks cannot get at signing credentials. That
          # protection is redundant here -- GitHub does not pass secrets to fork
          # PRs at all, so HAS_MAC_CERT is false and CSC_LINK stays unset there --
          # while leaving it off means no PR can ever verify the signing chain,
          # which is the whole point of running this on a PR.
          CSC_FOR_PULL_REQUEST: ${{ env.HAS_MAC_CERT }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji-api.kizuna.ai' }}
          VITE_ENVIRONMENT: production
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_VOLCENGINE_ST: ${{ vars.VITE_ENABLE_VOLCENGINE_ST }}
          VITE_ENABLE_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_VOLCENGINE_AST2 }}
          VITE_ENABLE_PALABRA_AI: ${{ vars.VITE_ENABLE_PALABRA_AI }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_KIZUNA_SONIOX: ${{ vars.VITE_ENABLE_KIZUNA_SONIOX }}
          VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE: ${{ vars.VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE }}
          VITE_ENABLE_KIZUNA_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_KIZUNA_VOLCENGINE_AST2 }}
          VITE_ENABLE_ZOOM_AI: ${{ vars.VITE_ENABLE_ZOOM_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}

      # electron-builder logs "skipped macOS code signing" and carries on when it
      # cannot find an identity, so an unsigned release would look like a success.
      # An ad-hoc signature yields a cdhash DR, which is exactly what stops
      # Squirrel.Mac from ever accepting an update -- fail loudly instead.
      - name: Verify the macOS update artifacts (signature + zip + manifest)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        run: |
          set -euo pipefail
          APP=$(find out/make-mac -name 'Sokuji.app' -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "No Sokuji.app found under out/make-mac" >&2
            exit 1
          fi
          DR=$(codesign -d -r- "$APP" 2>&1 | grep 'designated =>' | sed 's/^#* *designated => //')
          echo "designated requirement: $DR"
          case "$DR" in
            *"certificate root = H"*|*"certificate leaf = H"*)
              echo "OK: stable, certificate-pinned designated requirement." ;;
            *cdhash*)
              echo "FAIL: ad-hoc signature (cdhash DR). Signing was skipped --" >&2
              echo "the certificate was probably not discoverable via find-identity -v." >&2
              exit 1 ;;
            *)
              echo "FAIL: unrecognised designated requirement." >&2
              exit 1 ;;
          esac
          codesign --verify --deep --strict "$APP"
          echo "OK: bundle passes strict nested validation."

          # MacUpdater installs the zip and nothing else -- it rejects pkg and dmg
          # outright -- and only the zip target emits latest-mac.yml plus the
          # blockmap. Missing either one leaves auto-update dead with a green build.
          ZIP=$(find out/make-mac -maxdepth 1 -name '*.zip' | head -1)
          YML=out/make-mac/latest-mac.yml
          [ -n "$ZIP" ] || { echo "FAIL: no macOS .zip produced; electron-updater has nothing to install." >&2; exit 1; }
          [ -f "$YML" ] || { echo "FAIL: no latest-mac.yml produced." >&2; exit 1; }
          echo "OK: $(basename "$ZIP")"
          echo "--- latest-mac.yml ---"
          cat "$YML"
          grep -q "$(basename "$ZIP")" "$YML" || {
            echo "FAIL: latest-mac.yml does not reference $(basename "$ZIP")." >&2; exit 1; }
          echo "OK: manifest references the zip."

      - name: Build Chrome Extension
        if: matrix.os == 'ubuntu-latest' && matrix.arch != 'arm64'
        run: |
          cd extension
          npm ci
          # Build extension with production mode for releases
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            NODE_ENV=production npm run build -- --mode production
            cd dist
            zip -r "../sokuji-extension-${VERSION}.zip" *
            cd ..
          else
            npm run build
            # Verify the build output exists
            if [ ! -d "dist" ]; then
              echo "Extension build failed: dist directory not found"
              exit 1
            fi
          fi
        env:
          # Production environment variables for extension
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://sokuji-api.kizuna.ai' }}
          POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_ENABLE_VOLCENGINE_ST: ${{ vars.VITE_ENABLE_VOLCENGINE_ST }}
          VITE_ENABLE_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_VOLCENGINE_AST2 }}
          VITE_ENABLE_PALABRA_AI: ${{ vars.VITE_ENABLE_PALABRA_AI }}
          VITE_ENABLE_KIZUNA_AI: ${{ vars.VITE_ENABLE_KIZUNA_AI }}
          VITE_ENABLE_KIZUNA_SONIOX: ${{ vars.VITE_ENABLE_KIZUNA_SONIOX }}
          VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE: ${{ vars.VITE_ENABLE_KIZUNA_OPENAI_TRANSLATE }}
          VITE_ENABLE_KIZUNA_VOLCENGINE_AST2: ${{ vars.VITE_ENABLE_KIZUNA_VOLCENGINE_AST2 }}
          VITE_ENABLE_ZOOM_AI: ${{ vars.VITE_ENABLE_ZOOM_AI }}
          VITE_ENABLE_LOCAL_NATIVE: ${{ vars.VITE_ENABLE_LOCAL_NATIVE }}

      # Release-specific steps
      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'linux-x64'
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s")
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s")
          fi
          # Save changelog to a file for the release
          echo "$CHANGELOG" > CHANGELOG.md

      - name: Upload Linux x64 artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-artifacts
          path: |
            out/make-linux/*.AppImage
            out/make-linux/*.deb
            out/make-linux/latest-linux.yml
            extension/sokuji-extension-*.zip
            CHANGELOG.md

      - name: Upload Linux ARM64 artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'linux-arm64'
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-artifacts
          path: |
            out/make-linux/*.AppImage
            out/make-linux/*.deb
            out/make-linux/latest-linux-arm64.yml

      - name: Upload unsigned Windows installer for signing
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: windows-unsigned
          path: out/make/squirrel.windows/x64/*Setup*.exe

      - name: Upload Windows nupkg for release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: windows-nupkg
          path: out/make/squirrel.windows/x64/*.nupkg

      - name: Upload macOS artifacts
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-artifacts
          path: |
            out/make-mac/*.pkg
            out/make-mac/*.zip
            out/make-mac/*.blockmap
            out/make-mac/latest-mac.yml

  sign-windows:
    name: Sign Windows artifacts
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'kizuna-ai-lab/sokuji'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download unsigned artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-unsigned
          path: unsigned/

      # SignPath requires a github-artifact-id from upload-artifact.
      # We must re-upload because the original upload happened in a different job
      # and artifact IDs cannot be passed across jobs without explicit output wiring.
      - name: Upload for SignPath
        id: upload-for-signing
        uses: actions/upload-artifact@v6
        with:
          name: windows-to-sign
          path: unsigned/
          overwrite: true

      - name: Submit signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: default
          github-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/
          wait-for-completion-timeout-in-seconds: 3600

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-signed
          path: signed/

  release:
    # Only run for tag pushes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-x64-artifacts
          path: linux-x64-artifacts

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-arm64-artifacts
          path: linux-arm64-artifacts

      - name: Download signed Windows installer
        uses: actions/download-artifact@v7
        with:
          name: windows-signed
          path: windows-signed

      - name: Download Windows nupkg
        uses: actions/download-artifact@v7
        with:
          name: windows-nupkg
          path: windows-nupkg

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-artifacts
          path: macos-arm64-artifacts

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v7
        with:
          name: macos-x64-artifacts
          path: macos-x64-artifacts

      - name: Debug artifacts structure
        run: |
          echo "=== Linux x64 ==="
          find linux-x64-artifacts -type f || true
          echo "=== Linux ARM64 ==="
          find linux-arm64-artifacts -type f || true
          echo "=== Windows (signed) ==="
          find windows-signed -type f || true
          echo "=== Windows (nupkg) ==="
          find windows-nupkg -type f || true
          echo "=== macOS ARM64 ==="
          find macos-arm64-artifacts -type f || true
          echo "=== macOS x64 ==="
          find macos-x64-artifacts -type f || true

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find linux-x64-artifacts -name "*.deb" -exec cp {} release-assets/ \;
          find linux-x64-artifacts -name "*.AppImage" -exec cp {} release-assets/ \;
          find linux-x64-artifacts -name "latest-linux.yml" -exec cp {} release-assets/ \;
          find linux-x64-artifacts -name "sokuji-extension-*.zip" -exec cp {} release-assets/ \;
          find linux-arm64-artifacts -name "*.deb" -exec cp {} release-assets/ \;
          find linux-arm64-artifacts -name "*.AppImage" -exec cp {} release-assets/ \;
          find linux-arm64-artifacts -name "latest-linux-arm64.yml" -exec cp {} release-assets/ \;
          find windows-signed -name "*.exe" -exec cp {} release-assets/ \;
          find windows-nupkg -name "*.nupkg" -exec cp {} release-assets/ \;
          find macos-arm64-artifacts -name "*.pkg" -exec cp {} release-assets/ \;
          find macos-x64-artifacts -name "*.pkg" -exec cp {} release-assets/ \;
          # The zip is what electron-updater installs on macOS: MacUpdater accepts
          # only a zip and rejects pkg/dmg outright. The blockmap next to it is what
          # makes subsequent updates differential.
          find macos-arm64-artifacts -name "*.zip" -exec cp {} release-assets/ \;
          find macos-x64-artifacts -name "*.zip" -exec cp {} release-assets/ \;
          find macos-arm64-artifacts -name "*.blockmap" -exec cp {} release-assets/ \;
          find macos-x64-artifacts -name "*.blockmap" -exec cp {} release-assets/ \;
          # Squirrel generates filenames with spaces (e.g. "Sokuji-0.15.12 Setup.exe").
          # Rename to use dots so asset names are consistent and latest.yml URLs match.
          cd release-assets
          for f in *' '*; do
            [ -e "$f" ] || continue
            mv "$f" "${f// /.}"
          done
          cd ..
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Generate latest.yml for auto-updater
        run: |
          # Find the signed Windows .exe
          EXE_FILE=$(find release-assets -name "*.exe" | head -1)
          if [ -z "$EXE_FILE" ]; then
            echo "Warning: No .exe found, skipping latest.yml generation"
            exit 0
          fi

          EXE_NAME=$(basename "$EXE_FILE")
          VERSION=${GITHUB_REF_NAME#v}
          SHA512=$(openssl dgst -sha512 -binary "$EXE_FILE" | openssl base64 -A)
          SIZE=$(stat -c%s "$EXE_FILE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          {
            echo "version: ${VERSION}"
            echo "files:"
            echo "  - url: ${EXE_NAME}"
            echo "    sha512: ${SHA512}"
            echo "    size: ${SIZE}"
            echo "path: ${EXE_NAME}"
            echo "sha512: ${SHA512}"
            echo "releaseDate: '${DATE}'"
          } > release-assets/latest.yml

          echo "=== latest.yml ==="
          cat release-assets/latest.yml

      - name: Merge the per-arch latest-mac.yml files
        # The zip target sets isWriteUpdateInfo, so electron-builder now writes a
        # correct latest-mac.yml itself -- no hand-rolled sha512 loop any more.
        # But each arch runner writes its own, and electron-updater fetches a
        # single latest-mac.yml (no arch suffix), so the two files[] lists have
        # to be combined. MacUpdater then picks the entry matching process.arch.
        run: |
          set -euo pipefail
          ARM=$(find macos-arm64-artifacts -name latest-mac.yml | head -1)
          X64=$(find macos-x64-artifacts -name latest-mac.yml | head -1)
          if [ -z "$ARM" ] && [ -z "$X64" ]; then
            echo "No latest-mac.yml produced -- macOS auto-update will not work."
            echo "That is expected when MACOS_CSC_LINK is unset (unsigned build)."
            exit 0
          fi
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 - "$ARM" "$X64" <<'PY'
          import sys, yaml
          paths = [p for p in sys.argv[1:3] if p]
          docs = [yaml.safe_load(open(p)) for p in paths]
          # Prefer arm64 for the top-level path/sha512 fields, matching what the
          # previous hand-rolled step produced.
          primary = next((d for p, d in zip(paths, docs) if 'arm64' in p), docs[0])
          seen, files = set(), []
          for d in docs:
              for f in d.get('files', []):
                  if f['url'] not in seen:
                      seen.add(f['url'])
                      files.append(f)
          merged = dict(primary)
          merged['files'] = files
          with open('release-assets/latest-mac.yml', 'w') as fh:
              yaml.safe_dump(merged, fh, default_flow_style=False, sort_keys=False)
          PY
          echo "=== latest-mac.yml ==="
          cat release-assets/latest-mac.yml

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: linux-x64-artifacts/CHANGELOG.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
