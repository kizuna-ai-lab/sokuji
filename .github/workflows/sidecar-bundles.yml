# .github/workflows/sidecar-bundles.yml
# Build the self-contained sidecar bundles per SKU (spec D10 + the distribution
# spec). Five platform SKUs (spec §7 rename — no more GPU-vendor SKU names;
# Vulkan/Metal cover every vendor uniformly, mirroring native-build.yml's
# runner choices): linux-x64, linux-arm64, win-x64, mac-arm64, mac-x64.
# Two lanes (spec S11):
#   - workflow_dispatch: dry run — Actions artifacts only (size measurement, smoke).
#   - sidecar-vX.Y.Z tag push: build all SKUs and publish a PRERELEASE GitHub
#     Release with the archives + merged manifest.json. Always prerelease:
#     electron-updater resolves the repo's "latest release" to find latest*.yml
#     for app auto-update — a sidecar release must never win that lookup.
# Signing/notarization stays an operator follow-up; artifacts are unsigned.
name: sidecar-bundles

permissions:
  contents: read

env:
  # Every build job boot-smokes the archive it just packed (scripts/sidecar-
  # bundle-smoke.py) through its OWN embedded interpreter: import
  # sokuji_sidecar, probe sokuji_native, boot to the {"port": n} handshake.
  # sidecar/requirements.txt now pins the sokuji-native release wheel per
  # platform (native-v1.0.0), so a bundle with no sokuji_native inside is a
  # bug, not an expected state — this gate is a hard failure in every job.
  SIDECAR_SMOKE_REQUIRE_NATIVE: '1'

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version override (defaults to package.json sidecarVersion)
        required: false
        default: ''
  push:
    tags: ['sidecar-v*']

jobs:
  build-linux-x64:
    # ubuntu-22.04, matching native-build.yml's R37 linux lanes (glibc 2.35 floor);
    # this job's own interpreter is python-build-standalone (portable), so only the
    # sokuji-native wheel it installs is floor-sensitive, not this runner's own glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify tag matches package.json sidecarVersion
        if: startsWith(github.ref, 'refs/tags/sidecar-v')
        run: |
          WANT="${GITHUB_REF_NAME#sidecar-v}"
          HAVE="$(node -p "require('./package.json').sidecarVersion")"
          [ "$WANT" = "$HAVE" ] || { echo "tag $WANT != package.json sidecarVersion $HAVE"; exit 1; }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install zstandard
      - name: Build linux-x64 bundle
        env:
          VERSION: ${{ inputs.version }}
          # Authenticates the python-build-standalone release lookup: hosted
          # runners share egress IPs whose anonymous API quota is exhausted.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build-sidecar-bundle.py --sku linux-x64 --version "$VERSION" --archive --out out/bundles
      - name: Bundle size
        shell: bash
        run: |
          ls -la out/bundles/ | tee -a "$GITHUB_STEP_SUMMARY"
          cat out/bundles/sidecar-linux-x64-v*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Boot smoke the packed bundle
        # ubuntu-22.04 IS x86_64 hardware (GH-hosted runners are native, not
        # cross-hosted), so this job can boot its own bundle's embedded
        # interpreter just like linux-arm64 always could.
        run: python scripts/sidecar-bundle-smoke.py --sku linux-x64 --bundles-dir out/bundles
      - uses: actions/upload-artifact@v6
        with:
          name: sidecar-linux-x64
          path: out/bundles/sidecar-linux-x64-v*

  build-linux-arm64:
    # ubuntu-22.04-arm, matching native-build.yml's R37 linux lanes (glibc 2.35 floor).
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify tag matches package.json sidecarVersion
        if: startsWith(github.ref, 'refs/tags/sidecar-v')
        run: |
          WANT="${GITHUB_REF_NAME#sidecar-v}"
          HAVE="$(node -p "require('./package.json').sidecarVersion")"
          [ "$WANT" = "$HAVE" ] || { echo "tag $WANT != package.json sidecarVersion $HAVE"; exit 1; }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install zstandard
      - name: Build linux-arm64 bundle
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build-sidecar-bundle.py --sku linux-arm64 --version "$VERSION" --archive --out out/bundles
      - name: Bundle size
        shell: bash
        run: |
          ls -la out/bundles/ | tee -a "$GITHUB_STEP_SUMMARY"
          cat out/bundles/sidecar-linux-arm64-v*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Boot smoke the packed bundle
        # This runner IS the target arch, so unpack the archive we just built
        # and boot the bundled interpreter to the {"port": n} handshake —
        # catches exec-format, symlink and perm regressions before release.
        # scripts/sidecar-bundle-smoke.py joins split .001/.002 parts itself.
        run: python scripts/sidecar-bundle-smoke.py --sku linux-arm64 --bundles-dir out/bundles
      - uses: actions/upload-artifact@v6
        with:
          name: sidecar-linux-arm64
          path: out/bundles/sidecar-linux-arm64-v*

  build-win-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify tag matches package.json sidecarVersion
        if: startsWith(github.ref, 'refs/tags/sidecar-v')
        shell: bash
        run: |
          WANT="${GITHUB_REF_NAME#sidecar-v}"
          HAVE="$(node -p "require('./package.json').sidecarVersion")"
          [ "$WANT" = "$HAVE" ] || { echo "tag $WANT != package.json sidecarVersion $HAVE"; exit 1; }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install zstandard
      - name: Build win-x64 bundle
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build-sidecar-bundle.py --sku win-x64 --version "$env:VERSION" --archive --out out/bundles
      - name: Bundle size
        shell: bash
        run: |
          ls -la out/bundles/ | tee -a "$GITHUB_STEP_SUMMARY"
          cat out/bundles/sidecar-win-x64-v*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Boot smoke the packed bundle
        # windows-2022 IS x86_64 hardware. No system tar/zstd needed: the
        # script unpacks with the `zstandard` package already pip-installed
        # into this job's host python, then runs the bundle's own
        # python/python.exe.
        run: python scripts/sidecar-bundle-smoke.py --sku win-x64 --bundles-dir out/bundles
      - uses: actions/upload-artifact@v6
        with:
          name: sidecar-win-x64
          path: out/bundles/sidecar-win-x64-v*

  build-mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify tag matches package.json sidecarVersion
        if: startsWith(github.ref, 'refs/tags/sidecar-v')
        run: |
          WANT="${GITHUB_REF_NAME#sidecar-v}"
          HAVE="$(node -p "require('./package.json').sidecarVersion")"
          [ "$WANT" = "$HAVE" ] || { echo "tag $WANT != package.json sidecarVersion $HAVE"; exit 1; }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install zstandard
      - name: Build mac-arm64 bundle
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build-sidecar-bundle.py --sku mac-arm64 --version "$VERSION" --archive --out out/bundles
      - name: Bundle size
        shell: bash
        run: |
          ls -la out/bundles/ | tee -a "$GITHUB_STEP_SUMMARY"
          cat out/bundles/sidecar-mac-arm64-v*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Boot smoke the packed bundle
        # macos-14 IS Apple Silicon hardware (CPU-only smoke: these runners
        # are paravirtual VMs with no real GPU, so no Metal-device claim here).
        run: python scripts/sidecar-bundle-smoke.py --sku mac-arm64 --bundles-dir out/bundles
      - uses: actions/upload-artifact@v6
        with:
          name: sidecar-mac-arm64
          path: out/bundles/sidecar-mac-arm64-v*

  build-mac-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify tag matches package.json sidecarVersion
        if: startsWith(github.ref, 'refs/tags/sidecar-v')
        run: |
          WANT="${GITHUB_REF_NAME#sidecar-v}"
          HAVE="$(node -p "require('./package.json').sidecarVersion")"
          [ "$WANT" = "$HAVE" ] || { echo "tag $WANT != package.json sidecarVersion $HAVE"; exit 1; }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install zstandard
      - name: Build mac-x64 bundle
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build-sidecar-bundle.py --sku mac-x64 --version "$VERSION" --archive --out out/bundles
      - name: Bundle size
        shell: bash
        run: |
          ls -la out/bundles/ | tee -a "$GITHUB_STEP_SUMMARY"
          cat out/bundles/sidecar-mac-x64-v*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Boot smoke the packed bundle
        # macos-15-intel IS x86_64 hardware (CPU-only smoke: paravirtual VM,
        # no real GPU — no Metal-device claim here, same as mac-arm64).
        run: python scripts/sidecar-bundle-smoke.py --sku mac-x64 --bundles-dir out/bundles
      - uses: actions/upload-artifact@v6
        with:
          name: sidecar-mac-x64
          path: out/bundles/sidecar-mac-x64-v*

  release:
    if: startsWith(github.ref, 'refs/tags/sidecar-v')
    needs: [build-linux-x64, build-linux-arm64, build-win-x64, build-mac-arm64, build-mac-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: out/bundles
          merge-multiple: true
      - name: Merge per-SKU manifest fragments
        run: python scripts/build-sidecar-bundle.py --merge-fragments out/bundles/sidecar-*.json --merged-out out/bundles/manifest.json
      - name: Bundle sizes summary
        run: |
          ls -la out/bundles/ | tee -a "$GITHUB_STEP_SUMMARY"
          cat out/bundles/manifest.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            out/bundles/sidecar-*.tar.zst*
            out/bundles/manifest.json
