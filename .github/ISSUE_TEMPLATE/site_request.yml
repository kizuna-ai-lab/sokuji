name: 🌐 Site Support Request
description: Request browser-extension support for a video-meeting site (any other site — use the desktop app)
title: "[Site]: "
labels: ["site-request", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us expand Sokuji!

        **The browser extension supports video-meeting platforms only** — sites where you join a call with other people (Google Meet, Teams, Zoom, Jitsi, and similar). Each one needs its own integration work (content script, virtual-mic injection, subtitle overlay), so we add them one at a time.

        ### 💡 Anything else? The desktop app already covers it

        For **video sites, live streams, media playback, or any other website or application**, you don't need to wait for us — the **desktop app** adds a system-wide virtual microphone that works with **any** app (OBS, native clients, browsers, and more). No per-site support required, nothing to request.

        👉 **Download: https://sokuji.kizuna.ai/**

        Requests for non-meeting sites will be closed with a link to the desktop app.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: The extension can only attach to a meeting page running in the browser. Please confirm both before filing.
      options:
        - label: This is a video-meeting platform — a site where I join a call with other people.
          required: true
        - label: The meeting runs in the browser, not in a desktop-only client.
          required: true

  - type: input
    id: site-url
    attributes:
      label: Site URL / domain
      description: The exact address shown in your browser's address bar while you are **in** a meeting. Feel free to redact meeting IDs.
      placeholder: e.g. meet.example.com
    validations:
      required: true

  - type: input
    id: platform-name
    attributes:
      label: Platform name (if known)
      description: The product name of the meeting service
      placeholder: e.g. Acme Meet

  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: How you use it, roughly how many people would benefit, or anything else that helps us prioritise.
      placeholder: Optional context...
