name: 🐛 Bug Report
description: Report a technical issue or bug in the application
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Important Notice
        
        **This template is for reporting technical bugs only.** 
        
        Issues about project management, star counts, repository visibility, or other non-technical matters will be closed immediately.
        
        Please ensure you have:
        - ✅ Read our [Contributing Guidelines](https://github.com/kizuna-ai-lab/sokuji/blob/main/.github/CONTRIBUTING.md)
        - ✅ Searched existing issues to avoid duplicates
        - ✅ Tested with the latest version
        
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you have completed these steps
      options:
        - label: I have read the contributing guidelines
          required: true
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This is a technical bug report, not a general question or discussion
          required: true
        - label: I have tested this with the latest version
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the bug occur?
      options:
        - Desktop Application
        - Browser Extension
        - Both Desktop and Extension
        - Other
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      description: Which operating system(s) are you on? (Select all that apply)
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The Sokuji version you are running — shown in Settings, or in the extension's details page. Extension and desktop app share version numbers.
      placeholder: "e.g. 0.34.6"
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: AI Provider
      description: Which translation provider were you using when the bug occurred? (e.g. OpenAI, Gemini, Palabra.ai, Kizuna AI, OpenAI Compatible, Local Inference)
      placeholder: "e.g. OpenAI"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > ### ⚠️ Using **OpenAI Compatible** (a third-party OpenAI-compatible endpoint)?
        >
        > Please read this before continuing — it sets expectations for what we can do.
        >
        > We have no stable OpenAI-compatible endpoint to test against, so we **cannot reliably reproduce or verify** a bug that only happens on one. We will still read the code and may be able to fix it from your description alone, but **we cannot promise a fix**, and anything we do ship for such a bug goes out unverified against a real compatible endpoint.
        >
        > **Two things make an enormous difference:**
        >
        > 1. **Try the same thing against OpenAI's own endpoint.** Keep the provider set to **OpenAI Compatible**, point the endpoint at `https://api.openai.com`, and use an official OpenAI API key. That keeps everything in Sokuji identical and changes only the endpoint, so whether the bug follows tells us a great deal. Please say which way it went. (Switching to the built-in **OpenAI** provider instead is *not* the same test — that path uses a different realtime client, so a bug can vanish for reasons unrelated to your endpoint.)
        > 2. **If you can test changes against your endpoint, opening a PR alongside this report is by far the most reliable way to get it fixed.** A fix verified by someone who can actually run it is worth much more than a blind one from us, and for this category of bug it is realistically the most dependable route to a resolution.
        >
        > Also worth knowing: a fair share of reports in this category turn out to be the endpoint itself (proxy misconfiguration, unimplemented parts of the realtime API, dropped sockets) rather than Sokuji. Raw WebSocket frames are the fastest way to tell the two apart — see the Screenshots/Logs field below.

  - type: input
    id: model
    attributes:
      label: Model
      description: Which model were you using? For Local Inference, please specify the translation model you selected (e.g. Opus-MT en→zh).
      placeholder: "e.g. gpt-4o-mini, gemini-2.5-flash, qwen2.5-7b, Opus-MT en→zh"
    validations:
      required: false

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details (optional)
      description: Fill in what you know and skip the rest.
      value: |
        - OS version (e.g. Windows 11 23H2, macOS 14.5, Ubuntu 22.04):
        - Browser + version (extension only, e.g. Chrome 120):
        - CPU architecture (e.g. x64, arm64 / Apple Silicon):
        - Installed from (e.g. GitHub Release, Chrome Web Store):

  - type: textarea
    id: extension-specific
    attributes:
      label: Extension-Specific Information (if applicable)
      description: If this is an extension-related bug, please provide additional details
      placeholder: |
        - Extension permissions granted: [list permissions]
        - Websites where the issue occurs: [specific URLs or domains]
        - Extension popup/content script behavior: [describe]
        - Console errors in browser dev tools: [paste errors]
        - Extension conflicts: [other extensions that might interfere]

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Logs
      description: |
        Screenshots, browser/DevTools console output, or application logs. Sokuji's own diagnostic logs are off by default — there is a switch in Help that turns on the Logs panel.

        For realtime providers, the raw WebSocket frames are the single most useful thing you can attach — but ⚠️ **this issue is public and those frames carry your own data**, so please prepare them first:

        - **Attach only** `session.created` / `session.update` / `session.updated` and anything with `"type": "error"`.
        - **Redact the `instructions` field** in those frames — it holds your system prompt, including any custom prompt you configured.
        - **Do not attach `conversation.*` or `response.*` frames at all.** Those are the transcripts and translations of everything spoken in the session.
        - **Never paste the connection URL — it carries your API key.**
        - Skip `input_audio_buffer.append` frames; they are base64 audio and enormous.

        If that is more editing than you want to do, capture a throwaway session in which you only say something harmless and send those frames instead.
      placeholder: |
        For Desktop App: Paste screenshots or application logs here...
        For Extension: Include browser console errors, extension popup screenshots, etc.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any additional information... 